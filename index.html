<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160d18">
  <title>For You · Pirate Cove</title>
  <link rel="stylesheet" href="gift-box.css">
  <script src="gift-box.js" defer></script>
</head>
<body>
  <main class="cove">
    <header class="camera"><span>CAM 1C / PIRATE COVE</span><span>● REC</span></header>

    <section class="intro" aria-labelledby="title">
      <p class="caption">Five Nights at Freddy’s</p>
      <h1 id="title">For you, my love.</h1>
      <p>A little gift from your favourite night guard.</p>
    </section>

    <div class="stage">
      <div class="curtain left" aria-hidden="true"></div>
      <div class="curtain right" aria-hidden="true"></div>
      <div class="sign" aria-hidden="true">SORRY!<br>OUT OF ORDER</div>
      <div class="scene">
        <div class="gift">
          <div class="front" aria-hidden="true"></div>
          <div class="ribbon horizontal" aria-hidden="true"></div>
          <div class="ribbon vertical" aria-hidden="true"></div>
          <div class="bow" aria-hidden="true"><span class="tails"></span><span class="knot"></span></div>
          <div class="decoration">
            <svg viewBox="0 0 120 112" role="img" aria-label="Foxy the pirate fox with an eyepatch and gold eye">
              <path d="m22 45-9-30 14-9 23 25 24-2L93 5l15 8-8 36" fill="#b54231" stroke="#31151a" stroke-width="5" stroke-linejoin="round"/>
              <path d="m22 17 8 23 12-7zm76-1-18 20 13 7z" fill="#ec906d"/>
              <path d="m23 51 7-14 18-7 3-12 8 8 9-7 4 13 19 6 11 16-6 14 11 6-17 8 3 13-18 12H45L30 95l2-11-18-8 10-8z" fill="#c75139" stroke="#31151a" stroke-width="5" stroke-linejoin="round"/>
              <path d="m29 46 66 10" stroke="#321b23" stroke-width="7"/>
              <path d="M32 49q11-7 24 2l-4 17q-14 6-19-4z" fill="#21131b" stroke="#31151a" stroke-width="2"/>
              <ellipse cx="79" cy="58" rx="12" ry="10" fill="#ffcb6c" stroke="#3f1a21" stroke-width="4"/>
              <ellipse cx="80" cy="58" rx="3.5" ry="6" fill="#24151b"/>
              <circle cx="77" cy="55" r="2" fill="#fff6d4"/>
              <path d="M41 83q19-9 39 0l-2 15-17 5-17-6z" fill="#351920"/>
              <path d="m44 85 4 9 5-8 5 8 5-8 5 8 6-9" fill="#fff0ce"/>
              <path d="M36 76q10-14 24-12 14-2 25 12l-8 9-17-3-17 3z" fill="#eb986d" stroke="#54252a" stroke-width="2"/>
              <path d="M51 68q9-4 18 0l-9 8z" fill="#321b23"/>
            </svg>
            <p>Para mi <strong>Princesa</strong> <span aria-hidden="true">♥</span></p>
          </div>
        </div>
      </div>
      <div class="checker" aria-hidden="true"></div>
    </div>
    <p class="hint">Drag the gift to tilt it</p>
    <footer>I’d spend all five nights with you. <span aria-hidden="true">♥</span></footer>
  </main>
</body>
</html>
